services:
  mysql:
    image: mysql:8.4
    container_name: osrs-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: osrs_app
      MYSQL_USER: osrs_user
      MYSQL_PASSWORD: osrs_password
      MYSQL_ROOT_PASSWORD: osrs_root_password
    ports:
      - "3306:3306"
    volumes:
      - osrs_mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  osrs_mysql_data:
